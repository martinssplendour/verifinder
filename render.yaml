services:
  - type: web
    name: verifinder-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: python backend/combined_server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - verifinder.splendoure.com
    disk:
      name: verifinder-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 6
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.22.0
      - key: ENVIRONMENT
        value: production
      - key: INTERNAL_API_PORT
        value: 8000
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/data/verifinder.sqlite3
      - key: PUBLIC_DATA_MODE
        value: parquet
      - key: PUBLIC_DATA_ROOT
        value: /opt/render/project/src/backend/data/public-data
      - key: PUBLIC_DATA_EXPORT_MEMORY_LIMIT
        value: 320MB
      - key: PUBLIC_DATABASE_URL
        value: duckdb:////opt/render/project/src/backend/data/public-data/verifinder.duckdb
      - key: TRANSACTION_DATABASE_URL
        sync: false
      - key: TRANSACTION_MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_WgxPmETcd3bu6W5w6JDaOQ_1kxxAXhz
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://yftaqkthqfiwwvtcrhbj.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_WgxPmETcd3bu6W5w6JDaOQ_1kxxAXhz
      - key: SUBJECT_SIGNING_KEY
        sync: false
      - key: APP_URL
        value: https://verifinder.splendoure.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLUS_PRICE_ID
        sync: false
      - key: STRIPE_PLUS_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_COIN_PACK_25_PRICE_ID
        sync: false
      - key: STRIPE_COIN_PACK_75_PRICE_ID
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false
      - key: RAW_DATA_STORAGE
        value: /opt/render/project/src/backend/data/raw-data
      - key: CORS_ORIGINS
        value: https://verifinder.splendoure.com,https://verifinder-api.onrender.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      - key: EPC_API_KEY
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: zoho_mcp
      - key: ZOHO_MCP_URL
        sync: false
      - key: ZOHO_MAIL_ACCOUNT_ID
        value: "8056852000000002002"
      - key: NOTIFICATION_FROM_EMAIL
        value: "VeriFinder Alerts <alerts@splendoure.com>"
      - key: REPORT_STORAGE_BUCKET
        value: verifinder-reports
      - key: REPORT_SIGNED_URL_TTL_SECONDS
        value: 300
      - key: SCHEDULER_ENABLED
        value: true
      - key: SCHEDULER_INTERVAL_MINUTES
        value: 360
      - key: SCHEDULER_CYCLE_TIMEOUT_MINUTES
        value: 30
      - key: SUPABASE_BACKUPS_VERIFIED_AT
        sync: false
      - key: DATABASE_SNAPSHOT_URL
        value: https://github.com/martinssplendour/verifinder/releases/download/data-2026-08-22/verifinder.sqlite3.gz
      - key: DATABASE_SNAPSHOT_SHA256
        value: 4c81a7f6a2155fdece5b735c85ff74c4544048b8652ced7e6ef1b0ee4ecc457e
